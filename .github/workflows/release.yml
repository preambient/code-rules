name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: code-rules-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'davidosemwegie'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@preambient"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (p.version !== process.env.RELEASE_VERSION) throw new Error("Release version must match package.json");'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bash scripts/test-package.sh
      - name: Publish private package
        run: npm publish --ignore-scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published package and private visibility
        run: |
          bash scripts/test-published.sh
          test "$(gh api /orgs/preambient/packages/npm/code-rules --jq .visibility)" = private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
