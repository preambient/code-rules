name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: code-rules-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'davidosemwegie'
    runs-on: namespace-profile-preambient
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (p.version !== process.env.RELEASE_VERSION) throw new Error("Release version must match package.json");'
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bash scripts/test-package.sh
      - name: Publish package
        # npm accepts provenance and trusted (OIDC) publishing only from GitHub-hosted
        # runners, and releases run on Namespace, so publishing uses NPM_TOKEN.
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published package
        run: bash scripts/test-published.sh
